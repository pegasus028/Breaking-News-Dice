<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Newsroom Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css?v=2026-11-02e">
</head>
<body>
<div class="tc">
  <header class="tc-top">
    <div class="tc-brand">Breaking<br>News Dice</div>
    <div class="tc-round" id="round"></div>
    <div class="tc-timer" id="timer" aria-live="off"></div>
    <div class="tc-ctrl" id="ctrl"></div>
  </header>
  <div id="flash" class="err hidden" role="alert" style="margin:10px 24px 0"></div>
  <main class="tc-stage" id="stage"></main>
</div>
<aside class="drawer hidden" id="drawer" aria-label="Desks and posts"></aside>
<div class="gate hidden" id="gate">
  <form id="gateForm"><h1>Teacher PIN</h1><input id="pin" type="password" inputmode="numeric" autocomplete="off" aria-label="Teacher PIN">
    <button class="btn big primary">Open the board</button><p id="pinMsg" class="small" style="color:var(--alert)"></p></form>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="js/config.js?v=2026-11-02e"></script>
<script src="js/words.js?v=2026-11-02e"></script>
<script src="js/check.js?v=2026-11-02e"></script>
<script src="js/mock-gas.js?v=2026-11-02e"></script>
<script src="js/demo-settings.js?v=2026-11-02e"></script>
<script src="js/server.js?v=2026-11-02e"></script>
<script src="js/ui.js?v=2026-11-02e"></script>
<script src="js/bots.js?v=2026-11-02e"></script>
<script src="js/teacher.js?v=2026-11-02e"></script>
</body>
</html>
